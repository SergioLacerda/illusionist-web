version: 2

# One entry per ecosystem and directory. Each web surface keeps its own lockfile and
# release stream, so each gets its own update stream and pull requests.
# develop is the integration branch (main receives it through pull requests), so
# version updates target it.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web/strategist
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # vitest and @vitest/coverage-v8 pin each other's exact version, so they must
      # move together in a single PR (any update type, majors included). Listed first:
      # a dependency joins only the first group it matches.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check peers typescript ^5 || ^6; TS 7 breaks `npm ci` (ERESOLVE).
      # Drop this once a release of @astrojs/check accepts TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web/rgb-system
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
