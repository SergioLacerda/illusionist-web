      # a dependency joins only the first group it matches.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check peers typescript ^5 || ^6; TS 7 breaks `npm ci` (ERESOLVE).
      # Drop this once a release of @astrojs/check accepts TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web/providence-selector
