name: Release RGB

on:
  push:
    tags: ['rgb-v*']

permissions:
  contents: read

jobs:
  # Builds, tests and packages with read-only permissions.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/rgb-system
    env:
      SURFACE_NAME: illusionist-rgb-surface
      # The release is compiled for its target consumer (the RGB System page).
      ILLUSIONIST_SITE: https://sergiolacerda.github.io
      ILLUSIONIST_BASE: /rpg-system-rgb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the lineage check below; the token is not left in
          # .git/config while dependency scripts run.
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tagged commit ${GITHUB_SHA} is not an ancestor of origin/main; releases are cut from main"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/rgb-system/.nvmrc
          cache: npm
          cache-dependency-path: web/rgb-system/package-lock.json
      - name: Tag must match the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "rgb-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version rgb-v${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Package the static output
        run: |
          archive="${SURFACE_NAME}-${GITHUB_REF_NAME#rgb-}.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/release"
          epoch="$(git log -1 --format=%ct)"
          (cd dist && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort) > "$RUNNER_TEMP/entries.txt"
          tar -C dist --no-recursion -T "$RUNNER_TEMP/entries.txt" \
            --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner -cf - \
            | gzip -n > "$GITHUB_WORKSPACE/release/${archive}"
          if tar -tzf "$GITHUB_WORKSPACE/release/${archive}" | grep -qE '^(\./|/|web/)'; then
            echo "::error::archive entries must sit at the archive root"
            exit 1
          fi
      - name: Write the checksum
        working-directory: release
        run: |
          archive="${SURFACE_NAME}-${GITHUB_REF_NAME#rgb-}.tar.gz"
          sha256sum "${archive}" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Only this job holds contents: write, and it runs no repository or dependency
  # code: it re-verifies the checksum of the artifact built above and publishes it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: release
      - name: Verify the checksum
        working-directory: release
        run: |
          set -eu
          [ "$(ls -1 | wc -l)" -eq 2 ] || { echo "::error::expected exactly one archive and one checksum"; ls -l; exit 1; }
          archive="$(ls -1 *.tar.gz)"
          [ -f "${archive}.sha256" ] || { echo "::error::missing ${archive}.sha256"; exit 1; }
          sha256sum -c "${archive}.sha256"
      - name: Create the GitHub Release
        working-directory: release
        run: |
          set -eu
          archive="$(ls -1 *.tar.gz)"
          gh release create "${GITHUB_REF_NAME}" \
            "${archive}" "${archive}.sha256" \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
