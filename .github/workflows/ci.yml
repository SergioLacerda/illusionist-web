name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly run so new advisories surface on idle branches (audit job below).
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  strategist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/strategist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/strategist/.nvmrc
          cache: npm
          cache-dependency-path: web/strategist/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strategist-dist
          path: web/strategist/dist
          if-no-files-found: error

  rgb-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/rgb-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/rgb-system/.nvmrc
          cache: npm
          cache-dependency-path: web/rgb-system/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rgb-system-dist
          path: web/rgb-system/dist
          if-no-files-found: error

  providence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/providence
    env:
      ILLUSIONIST_SITE: https://sergiolacerda.github.io
      ILLUSIONIST_BASE: /providence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/providence/.nvmrc
          cache: npm
          cache-dependency-path: web/providence/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run cover
      - run: npm run build
      - run: node scripts/check-surface.mjs dist "$ILLUSIONIST_BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: providence-dist
          path: web/providence/dist
          if-no-files-found: error

  providence-selector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/providence-selector
    env:
      ILLUSIONIST_SITE: https://sergiolacerda.github.io
      ILLUSIONIST_BASE: /providence/selector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/providence-selector/.nvmrc
          cache: npm
          cache-dependency-path: web/providence-selector/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run cover
      - run: npm run build
      - run: node scripts/check-surface.mjs dist "$ILLUSIONIST_BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: providence-selector-dist
          path: web/providence-selector/dist
          if-no-files-found: error

  # Dependency audit: one matrix entry per surface, each under its own .nvmrc.
  # It reads the lockfile only (no install, so no lifecycle scripts run) and fails
  # on any advisory at or above AUDIT_LEVEL, including a registry error. Keep the
  # matrix in step with web/*; scripts/check-surfaces.mjs enforces it.
  audit:
    name: audit (${{ matrix.surface }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface: [strategist, rgb-system, providence, providence-selector]
    defaults:
      run:
        working-directory: web/${{ matrix.surface }}
    env:
      AUDIT_LEVEL: high
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/${{ matrix.surface }}/.nvmrc
      - run: npm audit --audit-level="$AUDIT_LEVEL"

  # Registry parity: make, CI, docs and README must list the same surfaces.
  surface-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-surfaces.mjs
